<!doctype html>
<html>
<head><meta charset="utf-8"><title>Settings</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    font: 13px -apple-system, "SF Pro Text", sans-serif;
    margin: 0; padding: 16px 18px 20px;
    background: light-dark(#f5f5f7, #1e1e22);
    color: light-dark(#1d1d1f, #e8e8ed);
    user-select: none;
  }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
       opacity: 0.55; margin: 18px 2px 6px; font-weight: 600; }
  h2:first-of-type { margin-top: 0; }
  .card {
    background: light-dark(#ffffff, #2a2a30);
    border: 1px solid light-dark(rgba(0,0,0,0.08), rgba(255,255,255,0.08));
    border-radius: 10px; padding: 4px 12px;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 9px 0; min-height: 24px;
  }
  .row + .row { border-top: 1px solid light-dark(rgba(0,0,0,0.06), rgba(255,255,255,0.06)); }
  .row > label:first-child { flex: 0 0 auto; }
  input.val { width: 48px; font: inherit; font-size: 12px; text-align: right; padding: 2px 4px;
    border-radius: 5px; border: 1px solid transparent; background: transparent; color: inherit;
    opacity: 0.7; font-variant-numeric: tabular-nums; }
  input.val:focus { border-color: light-dark(rgba(0,0,0,0.2), rgba(255,255,255,0.25));
    background: light-dark(#fff, #1e1e22); outline: none; opacity: 1; }
  input[type=range] { flex: 1; max-width: 180px; }
  input[type=text] {
    flex: 1; padding: 5px 8px; border-radius: 6px;
    border: 1px solid light-dark(rgba(0,0,0,0.15), rgba(255,255,255,0.15));
    background: light-dark(#fff, #1e1e22); color: inherit; font: inherit;
  }
  select { flex: 1; min-width: 0; padding: 5px 8px; border-radius: 6px;
    border: 1px solid light-dark(rgba(0,0,0,0.15), rgba(255,255,255,0.15));
    background: light-dark(#fff, #1e1e22); color: inherit; font: inherit; }
  input[type=color] {
    width: 34px; height: 24px; padding: 0; border: none; border-radius: 6px;
    background: none; cursor: pointer;
  }
  button {
    font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid light-dark(rgba(0,0,0,0.15), rgba(255,255,255,0.18));
    background: light-dark(#fff, #3a3a42); color: inherit;
  }
  button:active { filter: brightness(0.92); }
  .status { font-size: 12px; }
  .status.error { color: light-dark(#c62828, #ff9c9c); }
  .status.ok { color: light-dark(#2e7d32, #9cffb0); }
  #combo-display { font-size: 17px; min-width: 56px; }
  .hint { font-size: 11px; opacity: 0.55; }
  .colors-grid {
    display: flex; flex-direction: column; gap: 0;
    padding: 4px 12px; text-align: left; font-size: 12px;
  }
  .color-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .color-row + .color-row { border-top: 1px solid light-dark(rgba(0,0,0,0.06), rgba(255,255,255,0.06)); }
  .color-row label { display: flex; flex-direction: column; gap: 2px; }
  .color-row small { font-size: 11px; opacity: 0.58; }
  .colors-grid input[type=color] { border: 1px solid light-dark(#b8b8c0, #777780); }
  .tabs { display: flex; gap: 5px; overflow-x: auto; padding: 0 0 4px; margin-bottom: 2px; }
  .tab-button { flex: 0 0 auto; border: 1px solid transparent; padding: 6px 10px;
    border-radius: 7px; background: transparent; color: inherit; opacity: 0.62; }
  .tab-button.active { background: light-dark(#fff, #3a3a42);
    border-color: light-dark(#d1d1d6, #555560); opacity: 1; }
</style></head>
<body>
  <nav class="tabs" aria-label="Settings sections">
    <button class="tab-button active" type="button" data-tab="layout">Layout</button>
    <button class="tab-button" type="button" data-tab="appearance">Appearance</button>
    <button class="tab-button" type="button" data-tab="colors">Colors</button>
    <button class="tab-button" type="button" data-tab="interaction">Interaction</button>
    <button class="tab-button" type="button" data-tab="position">Position</button>
  </nav>
  <h2>Layout</h2>
  <div class="card">
    <div class="row">
      <input type="text" id="oryx" placeholder="Oryx layout URL or hash" />
      <button id="apply-url">Fetch</button>
    </div>
    <div class="row" id="url-status-row" hidden>
      <span class="status" id="url-status"></span>
    </div>
    <div class="row">
      <label for="colors-toggle">Use Oryx layer colors</label>
      <input type="checkbox" id="colors-toggle" />
    </div>
    <div class="row">
      <label for="autostart">Start at login</label>
      <input type="checkbox" id="autostart" />
    </div>
  </div>

  <h2>Appearance</h2>
  <div class="card">
    <div class="row">
      <label for="layer-action-icons">Show layer action icons</label>
      <input type="checkbox" id="layer-action-icons" />
    </div>
    <div class="row">
      <span class="hint">Tap, hold, double-tap, and tap-then-hold shortcuts from your layout.</span>
    </div>
    <div class="row">
      <label for="shift-icons">Show Shift icons</label>
      <input type="checkbox" id="shift-icons" />
    </div>
    <div class="row">
      <label for="shift-icon-scale">Shift icon size (50–250%)</label>
      <input type="range" id="shift-icon-scale" min="0.5" max="2.5" step="0.1" />
      <input class="val" id="shift-icon-scale-val" inputmode="decimal" aria-label="Shift icon size percentage" />
    </div>
    <div class="row">
      <label for="alternate-action-icons">Show alternate action icons</label>
      <input type="checkbox" id="alternate-action-icons" />
    </div>
    <div class="row">
      <label for="alternate-action-icon-scale">Alternate icon size (50–250%)</label>
      <input type="range" id="alternate-action-icon-scale" min="0.5" max="2.5" step="0.1" />
      <input class="val" id="alternate-action-icon-scale-val" inputmode="decimal" aria-label="Alternate action icon size percentage" />
    </div>
    <div class="row">
      <span class="hint">Icons for characters and actions reached by double-tap, hold, or tap-and-hold.</span>
    </div>
    <div class="row">
      <label>Background opacity</label>
      <input type="range" id="opacity" min="0" max="1" step="0.05" />
      <input class="val" id="opacity-val" inputmode="decimal" aria-label="Background opacity value" />
    </div>
    <div class="row">
      <label>Char opacity</label>
      <input type="range" id="char-opacity" min="0.2" max="1" step="0.05" />
      <input class="val" id="char-opacity-val" inputmode="decimal" aria-label="Char opacity value" />
    </div>
    <div class="row">
      <label>Border opacity</label>
      <input type="range" id="border-opacity" min="0" max="1" step="0.05" />
      <input class="val" id="border-opacity-val" inputmode="decimal" aria-label="Border opacity value" />
    </div>
    <div class="row">
      <label>Fill opacity</label>
      <input type="range" id="key-fill-opacity" min="0" max="1" step="0.05" />
      <input class="val" id="key-fill-opacity-val" inputmode="decimal" aria-label="Fill opacity value" />
    </div>
    <div class="row">
      <label>Border thickness</label>
      <input type="range" id="border-width" min="0" max="5" step="0.5" />
      <input class="val" id="border-width-val" inputmode="decimal" aria-label="Border thickness value" />
    </div>
    <div class="row">
      <label>Padding</label>
      <input type="range" id="padding" min="0" max="60" step="2" />
      <input class="val" id="padding-val" inputmode="decimal" aria-label="Padding value" />
    </div>
  </div>

  <h2>Colors</h2>
  <div class="card colors-grid">
    <div class="color-row"><input type="color" id="bg-color" /><label for="bg-color">Background<small>Overlay surface</small></label></div>
    <div class="color-row"><input type="color" id="key-fill-color" /><label for="key-fill-color">Key fill<small>Inside each key</small></label></div>
    <div class="color-row"><input type="color" id="text-color" /><label for="text-color">Text<small>Main key characters</small></label></div>
    <div class="color-row"><input type="color" id="legend-color" aria-label="Layer trigger color" /><label for="legend-color">Layer triggers<small>Tap, hold, and layer actions</small></label></div>
    <div class="color-row"><input type="color" id="shift-color" aria-label="Shift character color" /><label for="shift-color">Shift characters<small>Alternate characters from Shift</small></label></div>
    <div class="color-row"><input type="color" id="alternate-color" aria-label="Alternate character color" /><label for="alternate-color">Alternate characters<small>Double-tap, hold, or tap-and-hold results</small></label></div>
    <div class="color-row"><input type="color" id="border-color" /><label for="border-color">Border<small>Key outlines</small></label></div>
  </div>

  <h2>Fonts</h2>
  <div class="card">
    <div class="row"><label for="key-font-family">Key font</label><select id="key-font-family"><option value="">System default</option></select></div>
    <div class="row"><label for="key-font-size">Key size</label><input type="range" id="key-font-size" min="0.5" max="2" step="0.1" /><input class="val" id="key-font-size-val" inputmode="decimal" /></div>
    <div class="row"><label for="key-font-bold">Bold</label><input type="checkbox" id="key-font-bold" /><label for="key-font-italic">Italic</label><input type="checkbox" id="key-font-italic" /><label for="key-font-ligatures">Ligatures</label><input type="checkbox" id="key-font-ligatures" /></div>
    <div class="row"><label for="legend-font-family">Legend font</label><select id="legend-font-family"><option value="">System default</option></select></div>
    <div class="row"><label for="legend-font-size">Legend size</label><input type="range" id="legend-font-size" min="0.5" max="2" step="0.1" /><input class="val" id="legend-font-size-val" inputmode="decimal" /></div>
    <div class="row"><label for="legend-font-bold">Bold</label><input type="checkbox" id="legend-font-bold" /><label for="legend-font-italic">Italic</label><input type="checkbox" id="legend-font-italic" /><label for="legend-font-ligatures">Ligatures</label><input type="checkbox" id="legend-font-ligatures" /></div>
    <div class="row"><label for="layer-name-font-family">Layer name font</label><select id="layer-name-font-family"><option value="">System default</option></select></div>
    <div class="row"><label for="layer-name-font-size">Layer name size</label><input type="range" id="layer-name-font-size" min="8" max="24" step="1" /><input class="val" id="layer-name-font-size-val" inputmode="decimal" /></div>
    <div class="row"><label for="layer-name-font-bold">Bold</label><input type="checkbox" id="layer-name-font-bold" /><label for="layer-name-font-italic">Italic</label><input type="checkbox" id="layer-name-font-italic" /><label for="layer-name-font-ligatures">Ligatures</label><input type="checkbox" id="layer-name-font-ligatures" /></div>
  </div>

  <h2>Interaction</h2>
  <div class="card">
    <div class="row">
      <label>Grab hotkey</label>
      <span id="combo-display"></span>
      <button id="record">Record</button>
    </div>
    <div class="row">
      <span class="hint" id="record-hint">Hold to move and resize the overlay</span>
    </div>
  </div>

  <h2>Position</h2>
  <div class="card">
    <div class="row">
      <label>Overlay position</label>
      <button id="reset-position">Reset to center</button>
    </div>
  </div>

  <script type="module" src="settings.js"></script>
</body>
</html>
