<!doctype html>
<html>
<head><meta charset="utf-8"><title>Settings</title>
<style>
  body { font: 13px -apple-system, sans-serif; padding: 16px; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input[type=text] { width: 100%; }
  .error { color: #c00; font-size: 12px; }
  .ok { color: #080; font-size: 12px; }
  .colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .colors div { text-align: center; font-size: 11px; }
  .colors input { width: 100%; height: 28px; padding: 0; border: none; }
  .hotkey-row { display: flex; align-items: center; gap: 10px; }
  #combo-display { font-size: 18px; min-width: 60px; }
  button { padding: 4px 10px; }
  .section-gap { margin-top: 18px; }
</style></head>
<body>
  <label>Oryx layout URL or hash</label>
  <input type="text" id="oryx" />
  <button id="apply-url">Fetch &amp; apply</button>
  <span id="url-status"></span>

  <label>Background opacity <span id="opacity-val"></span></label>
  <input type="range" id="opacity" min="0.1" max="1" step="0.05" />

  <label>Keys opacity <span id="key-opacity-val"></span></label>
  <input type="range" id="key-opacity" min="0.2" max="1" step="0.05" />

  <label>Colors</label>
  <div class="colors">
    <div><input type="color" id="bg-color" /><br>Background</div>
    <div><input type="color" id="text-color" /><br>Text</div>
    <div><input type="color" id="legend-color" /><br>Legend</div>
    <div><input type="color" id="border-color" /><br>Border</div>
  </div>

  <label class="section-gap"><input type="checkbox" id="colors-toggle" /> Use Oryx layer colors</label>

  <label>Grab hotkey (hold to move/resize)</label>
  <div class="hotkey-row">
    <span id="combo-display"></span>
    <button id="record">Record</button>
    <span id="record-hint"></span>
  </div>

  <label class="section-gap">Overlay position</label>
  <button id="reset-position">Reset to center</button>

  <script type="module" src="settings.js"></script>
</body>
</html>
