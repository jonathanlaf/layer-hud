name: Release

on:
  push:
    tags:
      # Exact semver only (no prerelease suffix) — tauri.conf.json's version
      # field is plain semver, so a v0.1.0-beta1-style tag could never match
      # it in the version-check step below; keeping the pattern this strict
      # means such a tag is simply never picked up by this workflow at all.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must be reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} is not on main — deleting it and refusing to release."
            git push origin --delete "${{ github.ref_name }}"
            exit 1
          fi

  build:
    name: Build and release
    needs: guard
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches tauri.conf.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $CONF_VERSION"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify Cargo.lock is current
        working-directory: src-tauri
        run: cargo build --locked --release

      - name: Test release source and Cargo/Tauri version consistency
        working-directory: src-tauri
        run: cargo test --locked

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Layer HUD ${{ github.ref_name }}'
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false

      - name: Attest build provenance
        # Depends on tauri.conf.json's bundle.targets including "dmg" — if
        # that's ever reverted to just ["app"], this glob matches nothing.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'src-tauri/target/release/bundle/dmg/*.dmg'
